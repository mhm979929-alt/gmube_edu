<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - تقوية رياضيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Cairo', sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .header {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .title {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .live-badge {
            background: #fff;
            color: #ff0000;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 16px;
            border-radius: 30px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); background: #ffcccc; }
            100% { opacity: 0.7; transform: scale(0.95); }
        }
        .viewers-info {
            color: #fff;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .split-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
        }
        .video-column {
            flex: 2;
            min-width: 300px;
            position: relative;
        }
        .video-wrap {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }
        .video-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        
        /* عمود الدردشة المباشرة */
        .chat-column {
            flex: 1;
            min-width: 320px;
            background: #1a1a2e;
            border-right: 1px solid #333;
            height: auto;
            min-height: 500px;
            max-height: 700px;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: #2a2a3e;
            padding: 12px 20px;
            border-bottom: 1px solid #444;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header .online {
            color: #4CAF50;
            font-size: 0.8rem;
        }
        .chat-container {
            flex: 1;
            height: 100%;
            position: relative;
            background: #fff;
        }
        .chat-container iframe {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border: 0;
        }

        .footer {
            padding: 12px 20px;
            background: #1a1a2e;
            color: #aaa;
            text-align: center;
            border-top: 1px solid #333;
            font-size: 0.9rem;
        }
        .footer a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
        }

        /* ===== تحسينات الجوال ===== */
        @media (max-width: 900px) {
            .split-layout { flex-direction: column; }
            .chat-column { 
                border-right: none; 
                border-top: 1px solid #333; 
                min-height: 400px; 
                max-height: 500px;
                width: 100%;
            }
            .chat-container iframe { min-height: 400px; }
            .title { font-size: 1.2rem; }
            .viewers-info { font-size: 0.7rem; padding: 3px 10px; }
        }
        @media (max-width: 480px) {
            body { padding: 8px; padding-top: 10px; }
            .header { padding: 10px 15px; flex-direction: column; align-items: flex-start; gap: 5px; }
            .title { font-size: 1rem; }
            .chat-column { min-height: 350px; max-height: 400px; }
            .chat-container iframe { min-height: 350px; }
            .footer { font-size: 0.7rem; padding: 8px 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <span class="live-badge">🔴 مباشر</span>
                تقوية رياضيات
            </div>
            <div class="viewers-info">👤  </div>
        </div>

        <div class="split-layout">
            <!-- الفيديو -->
            <div class="video-column">
                <div class="video-wrap">
                    <iframe 
                        src="https://www.youtube.com/embed/7OwQXiGdy4I?autoplay=1&mute=1&controls=1&rel=0" 
                        allow="autoplay; encrypted-media; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <!-- الدردشة المباشرة (تظهر المحادثة فوراً) -->
            <div class="chat-column">
                <div class="chat-header">
                    <span>💬 دردشة مباشرة</span>
                    <span class="online">🟢 متصل الآن</span>
                </div>
                <div class="chat-container">
                    <!-- الرابط السحري: هذا الرابط يفتح المحادثة مباشرة بدون شاشة ترحيب -->
                    <iframe 
                        src="https://tawk.to/chat/6a7074dbdc34b31d4c319c64/1jv3kgufl?lang=ar&direct=true" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>

        <div class="footer">
            📢 تابعنا على <a href="#">يوتيوب</a> | جميع الحقوق محفوظة © 2026
        </div>
    </div>
</body>
</html>
