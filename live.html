<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - تقوية رياضيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Cairo', sans-serif;
            padding: 12px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        .header {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .title {
            color: #fff;
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .live-badge {
            background: #fff;
            color: #ff0000;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 16px;
            border-radius: 30px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); background: #ffcccc; }
            100% { opacity: 0.7; transform: scale(0.95); }
        }
        .viewers-info {
            color: #fff;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .video-wrap {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
        }
        .video-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .footer {
            padding: 12px 20px;
            background: #1a1a2e;
            color: #aaa;
            text-align: center;
            border-top: 1px solid #333;
            font-size: 0.9rem;
        }
        .footer a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .title { font-size: 1.2rem; }
            .viewers-info { font-size: 0.7rem; padding: 3px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- رأس الصفحة -->
        <div class="header">
            <div class="title">
                <span class="live-badge">🔴 مباشر</span>
                تقوية رياضيات
            </div>
            <div class="viewers-info">
                👤 142 مشاهد
            </div>
        </div>

        <!-- الفيديو -->
        <div class="video-wrap">
            <iframe 
                src="https://www.youtube.com/embed/sWVGXj1Vz9o?autoplay=1&mute=1&controls=1&rel=0" 
                allow="autoplay; encrypted-media; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- تذييل -->
        <div class="footer">
            📢 تابعنا على <a href="#">يوتيوب</a> | جميع الحقوق محفوظة © 2026
        </div>
    </div>

</html>
