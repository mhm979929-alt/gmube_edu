<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 12px;
        }
        .container {
            max-width: 880px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
        }
        .video-wrap {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .video-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .title {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 16px 20px 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .title span {
            background: #ff0000;
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 30px;
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            <span>مباشر</span> تقوية رياضيات
        </div>
        <div class="video-wrap">
            <iframe 
                src="https://www.youtube.com/embed/sWVGXj1Vz9o?autoplay=1&mute=1&controls=1&rel=0" 
                allow="autoplay; encrypted-media; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>
</body>
</html>
