<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GMube Edu</title>
  <meta name="description" content="منصة GMube Edu التعليمية السورية - دروس، كتب، اختبارات">
  <meta name="theme-color" content="#0a0a0a">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Feather Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

  <!-- Appwrite SDK -->
  <script src="https://cdn.jsdelivr.net/npm/appwrite@16/dist/iife/sdk.min.js"></script>

  <!-- Plyr (video player) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.css">
  <script src="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.min.js"></script>

  <!-- MathJax: عرض معادلات الاختبارات المكتوبة بصيغة LaTeX -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      chtml: { displayAlign: 'center' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css?v=admissions-profile-2">
  <link rel="stylesheet" href="css/enhance.css">
  
  <style>
    /* ===== تنسيق زر اسأل كتابك في القائمة السفلية ===== */
    #bottom-nav a.nav-item {
      flex: 1 0 auto;
      min-width: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: transparent;
      border: none;
      color: #888;
      font-family: 'Cairo', sans-serif;
      font-size: 10px;
      font-weight: 500;
      padding: 4px 2px;
      cursor: pointer;
      transition: color 0.2s;
      position: relative;
      white-space: nowrap;
      text-decoration: none;
    }
    #bottom-nav a.nav-item i {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }
    #bottom-nav a.nav-item span {
      font-size: 9px;
      line-height: 1.2;
    }
    #bottom-nav a.nav-item:hover {
      color: #6C63FF;
    }
    #bottom-nav a.nav-item.active {
      color: #6C63FF;
    }
    @media (max-width: 400px) {
      #bottom-nav a.nav-item span {
        font-size: 8px;
      }
      #bottom-nav a.nav-item i {
        width: 18px;
        height: 18px;
      }
    }

    /* ===== زر البث المباشر - غير مزعج ===== */
    .live-float-btn {
      position: fixed;
      bottom: 80px;
      right: 16px;
      z-index: 1000;
      background: rgba(108, 99, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(108, 99, 255, 0.25);
      border-radius: 50px;
      padding: 8px 14px 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #6C63FF;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.2);
      cursor: pointer;
      border: none;
    }
    .live-float-btn i {
      width: 18px;
      height: 18px;
      stroke-width: 2.5;
    }
    .live-float-btn .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.7);
      }
    }
    .live-float-btn:hover {
      background: rgba(108, 99, 255, 0.25);
      transform: scale(1.05);
      box-shadow: 0 6px 30px rgba(108, 99, 255, 0.35);
    }
    .live-float-btn:active {
      transform: scale(0.95);
    }

    /* إخفاء الزر في الصفحات غير الرئيسية */
    body:not([data-page="home"]) .live-float-btn {
      display: none;
    }

    @media (max-width: 500px) {
      .live-float-btn {
        bottom: 72px;
        right: 12px;
        padding: 6px 12px 6px 14px;
        font-size: 11px;
      }
      .live-float-btn i {
        width: 16px;
        height: 16px;
      }
      .live-float-btn .live-dot {
        width: 6px;
        height: 6px;
      }
    }
  </style>
</head>
<body>

<div id="app-shell">
  <div id="app-view">
    <!-- Pages render here -->
    <div style="display:flex;align-items:center;justify-content:center;height:100vh">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- ===== زر البث المباشر ===== -->
  <!-- Bottom Navigation -->
  <nav id="bottom-nav">
    <button class="nav-item active" data-page="home">
      <i data-feather="home"></i>
      <span>الرئيسية</span>
    </button>
    <button class="nav-item" data-page="teachers">
      <i data-feather="users"></i>
      <span>الأساتذة</span>
    </button>
    <button class="nav-item" data-page="books">
      <i data-feather="book"></i>
      <span>الكتب</span>
    </button>
    <button class="nav-item" data-page="tests">
      <i data-feather="check-square"></i>
      <span>اختبارات</span>
    </button>
    <a href="ask-book.html" class="nav-item" data-page="ask-book">
      <i data-feather="message-square"></i>
      <span>اسأل كتابك</span>
    </a>
    <button class="nav-item" data-page="profile">
      <i data-feather="user"></i>
      <span>حسابي</span>
    </button>
  </nav>
</div>

<!-- ============================================ -->
<!--  سكربتات الجافاسكريبت (الترتيب مهم جداً هنا)  -->
<!-- ============================================ -->

<!-- 1. Config (الإعدادات الأساسية) -->
<script src="js/config.js"></script>

<!-- pdf.js (قارئ PDF مدمج) -->

<!-- 2. API Layer (التواصل مع قاعدة البيانات) -->

<!-- 3. Auth (المصادقة وتسجيل الدخول) -->
<script src="js/auth.js"></script>

<!-- 4. Utils (الدوال المساعدة) -->
<script src="js/utils.js"></script>

<!-- 5. Router (التنقل بين الصفحات) -->

<!-- ============================================ -->
<!-- 6. Pages (جميع صفحات التطبيق)                -->
<!-- ============================================ -->
<script src="js/pages/home.js"></script>
<script src="js/pages/teachers.js"></script>
<script src="js/pages/books.js"></script>
<script src="js/pages/tests.js"></script>
<script src="js/pages/profile.js?v=admissions-profile-2"></script>
<script src="js/pages/login.js"></script>
<script src="js/pages/watch.js"></script>
<script src="js/pages/subject.js"></script>
<script src="js/pages/channel.js"></script>
<script src="js/pages/playlist.js"></script>
<script src="js/pages/notifications.js"></script>
<script src="js/pages/take-test.js"></script>
<script src="js/pages/university-admissions.js?v=admissions-profile-2"></script>

<!-- 7. App Bootstrap (تشغيل التطبيق)             -->
<!-- ============================================ -->
<script src="js/filekit.js"></script>
<script src="js/app.js"></script>

<!-- Init Feather Icons -->
<script>
  feather.replace();
  
  // ============================================
  // تفعيل التنقل في القائمة السفلية
  // ============================================
  document.addEventListener('DOMContentLoaded', function() {
    // إزالة الـ active من جميع الأزرار
    const navItems = document.querySelectorAll('#bottom-nav .nav-item');
    navItems.forEach(item => {
      item.classList.remove('active');
    });
    
    // تفعيل الزر حسب الصفحة الحالية
    const currentPage = window.location.hash.replace('#', '') || 'home';
    navItems.forEach(item => {
      const page = item.dataset.page;
      if (page === currentPage) {
        item.classList.add('active');
      }
    });

    // ===== تعيين data-page على body لتحديد ظهور زر البث =====
    const body = document.body;
    body.setAttribute('data-page', currentPage);

    // مراقبة تغييرات التجزئة (hash) لتحديث data-page
    window.addEventListener('hashchange', function() {
      const newPage = window.location.hash.replace('#', '') || 'home';
      body.setAttribute('data-page', newPage);
    });
  });
</script>

</body>
</html>
