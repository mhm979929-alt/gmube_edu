<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>العودة إلى المنصة التعليمية</title>
  <style>
    :root { font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #1f2937; }
    main { width: min(92vw, 420px); padding: 28px 22px; border: 1px solid #e5e7eb; border-radius: 18px; background: #fff; box-shadow: 0 12px 35px rgba(15, 23, 42, .08); text-align: center; }
    h1 { margin: 0 0 10px; font-size: 20px; }
    p { margin: 0 0 18px; color: #6b7280; line-height: 1.8; font-size: 14px; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #e5e7eb; border-top-color: #2f8f62; border-radius: 50%; animation: spin .8s linear infinite; }
    a { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #2f8f62; color: #fff; text-decoration: none; font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1 id="title">جاري إكمال تسجيل الدخول</h1>
    <p id="message">سنعود بك الآن إلى تطبيق المنصة التعليمية.</p>
    <a id="open-app" href="#" style="display:none">فتح التطبيق</a>
  </main>
  <script>
    (function () {
      const appDeepLink = "ac24://open4118422-kzxitb/";
      const params = new URLSearchParams(window.location.search);
      const userId = params.get("userId");
      const secret = params.get("secret");
      const failed = params.get("oauth") === "failed" || !userId || !secret;
      const appUrl = failed
        ? `${appDeepLink}?oauth=failed`
        : `${appDeepLink}?oauth=success&userId=${encodeURIComponent(userId)}&secret=${encodeURIComponent(secret)}`;

      const openApp = document.getElementById("open-app");
      openApp.href = appUrl;
      openApp.style.display = "inline-block";
      if (failed) {
        document.getElementById("title").textContent = "لم يكتمل تسجيل الدخول";
        document.getElementById("message").textContent = "سنعود إلى التطبيق لتجربة تسجيل الدخول مرة أخرى.";
      }

      // The one-time secret is never stored; it is only placed in the deep link.
      window.setTimeout(() => {
        document.getElementById("spinner").style.display = "none";
        window.location.href = appUrl;
      }, 550);
    }());
  </script>
</body>
</html>
